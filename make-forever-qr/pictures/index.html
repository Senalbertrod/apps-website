<script>
// Show one device at a time. (Without this, all of them show, one after another.)
(function () {
  var tabs = document.querySelectorAll('.tabs button');
  var panes = document.querySelectorAll('.pics');
  function show(id) {
    tabs.forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === id ? 'true' : 'false'); });
    panes.forEach(function (p) { p.hidden = p.id !== id; });
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab); }); });
  document.documentElement.classList.add('js');
  show('t0');
})();
</script>
