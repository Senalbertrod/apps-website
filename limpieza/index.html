<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limpieza del Salón</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#2f8fe0">
<link rel="manifest" href="manifest-v1.webmanifest">
<link rel="icon" href="icono-v1-192.png">
<link rel="apple-touch-icon" href="icono-v1-180.png">
<link rel="stylesheet" href="limpieza-v1.css">
</head>
<body>
<div id="stage">
  <img id="fondo" alt="" draggable="false">
  <div id="anim" aria-hidden="true"></div>
  <!-- The words on the screen, placed like the approved drawings (1920 × 1080). -->
  <svg id="texto" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <defs>
      <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop id="pill-top" offset="0"/><stop id="pill-bottom" offset="1"/></linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="12"/>
        <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <text x="960" y="160" text-anchor="middle" font-size="92" font-weight="800" fill="#1e3553" letter-spacing="1">Limpieza del Salón</text>
    <text id="fecha" x="960" y="222" text-anchor="middle" font-size="40"></text>
    <g id="con-grupo">
      <text x="960" y="335" text-anchor="middle" font-size="58" fill="#33383f">Hoy le toca a <tspan id="apellido" font-weight="800" fill="#1e2a36"></tspan></text>
      <g filter="url(#shadow)"><rect x="650" y="370" width="620" height="196" rx="98" fill="url(#pill)"/>
        <rect x="680" y="382" width="560" height="70" rx="35" fill="#fff" opacity=".22"/></g>
      <text id="grupo" x="960" y="508" text-anchor="middle" font-size="128" font-weight="800"></text>
      <text x="960" y="640" text-anchor="middle" font-size="46" fill="#33383f">¡Gracias por su ayuda!</text>
    </g>
    <text id="sin-reunion" x="960" y="470" text-anchor="middle" font-size="64" fill="#33383f">Esta semana no hay reunión</text>
  </svg>
</div>
<div id="hint">Doble clic para pantalla completa</div>
<script src="sin-reunion.js"></script>
<script src="limpieza-v1.js"></script>
</body>
</html>
